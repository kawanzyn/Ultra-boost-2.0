name: Basic Luau syntax validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  compile:
    name: Compile public Basic distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Luau compiler
        shell: bash
        run: |
          set -euo pipefail
          tag="$(curl -fsSL https://api.github.com/repos/luau-lang/luau/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          download_url="$(printf 'https://github.com/luau-lang/luau/releases/download/%s/luau-ubuntu.zip' "$tag")"
          curl -fsSL "$download_url" -o /tmp/luau.zip
          unzip -q /tmp/luau.zip -d /tmp/luau
          echo "/tmp/luau" >> "$GITHUB_PATH"

      - name: Compile and compare Basic files
        shell: bash
        run: |
          set -euo pipefail
          luau-compile UltraBoost.lua >/dev/null
          luau-compile dist/UltraBoost-Basic.lua >/dev/null
          cmp --silent UltraBoost.lua dist/UltraBoost-Basic.lua
