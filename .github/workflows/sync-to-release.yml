name: Sync private source to public Basic release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'kawanzyn/Ultra-boost-2.0'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout public release
        uses: actions/checkout@v4
        with:
          repository: kawanzyn/Ultra-boost-2.0-Release
          token: ${{ secrets.RELEASE_SYNC_TOKEN }}
          path: release
          ref: main

      - name: Validate Basic-only release staging
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          test -f release-public/README.md
          test -f release-public/CHANGELOG.md
          test -f dist/UltraBoost-Basic.lua

          if find release-public -type f | grep -Ei '(^|/)(src|ServerFinder)(/|$)|Premium'; then
            echo "Unsafe Premium/source content found in release-public staging."
            exit 1
          fi

      - name: Publish allowlisted Basic files only
        shell: bash
        run: |
          set -euo pipefail

          # Replace the public tree from a curated Basic-only allowlist.
          # --delete removes previously published Premium/source files.
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/luau-validation.yml' \
            source/release-public/ release/

          mkdir -p release/dist
          cp source/LICENSE release/LICENSE
          cp source/dist/UltraBoost-Basic.lua release/dist/UltraBoost-Basic.lua

          # Preserve the legacy root path for existing Basic loaders.
          cp source/dist/UltraBoost-Basic.lua release/UltraBoost.lua

          # Fail closed if a private/Premium path ever enters the release tree.
          unsafe_file="$(find release -path 'release/.git' -prune -o -type f \( -iname '*premium*' -o -path '*/src/*' -o -path '*/ServerFinder/*' \) -print -quit)"
          if [ -n "$unsafe_file" ]; then
            echo "Refusing to publish private content: $unsafe_file"
            exit 1
          fi

          cmp --silent release/UltraBoost.lua release/dist/UltraBoost-Basic.lua

      - name: Publish changes
        working-directory: release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No Basic release changes to publish."
            exit 0
          fi

          git commit -m "Publish Basic-only release from private source"
          git push origin HEAD:main
